!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R2
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 description Hacia R1 (RIP)
 ip address 10.0.12.2 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description Hacia R3 (BGP)
 ip address 10.0.23.1 255.255.255.252
 duplex auto
 speed auto
!
router rip
 version 2
 redistribute bgp 65100 metric 2 route-map BGP-TO-RIP
 network 10.0.0.0
 no auto-summary
!
router bgp 65100
 no synchronization
 bgp log-neighbor-changes
 redistribute rip route-map RIP-TO-BGP
 neighbor 10.0.23.2 remote-as 65000
 neighbor 10.0.23.2 description eBGP con R3
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
ip prefix-list PL-BGP-TO-RIP seq 5 permit 10.10.10.0/24
!
ip prefix-list PL-RIP-TO-BGP seq 5 permit 192.168.10.0/24
no cdp log mismatch duplex
!
!
!
route-map RIP-TO-BGP permit 10
 match ip address prefix-list PL-RIP-TO-BGP
!
route-map BGP-TO-RIP permit 10
 match ip address prefix-list PL-BGP-TO-RIP
 set metric 2
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
