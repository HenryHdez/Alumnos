<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de HTML con JavaScript</title>
</head>
<body>

    <!-- Título principal -->
    <h1>Ejemplo de HTML con JavaScript</h1>

    <!-- Párrafo con un ID para modificarlo con JavaScript -->
    <p id="texto">Este es un párrafo normal.</p>

    <!-- Botón que cambia el texto al hacer clic -->
    <button onclick="cambiarTexto()">Cambiar Texto</button>

    <!-- Botón que cambia el color del texto -->
    <button onclick="cambiarColor()">Cambiar Color</button>

    <!-- Botón que muestra un mensaje de alerta -->
    <button onclick="mostrarAlerta()">Mostrar Alerta</button>

    <!-- Sección para mostrar la hora actual -->
    <p>La hora actual es: <span id="hora"></span></p>
    <button onclick="mostrarHora()">Actualizar Hora</button>

    <script>
        // Función para cambiar el texto del párrafo
        function cambiarTexto() {
            document.getElementById("texto").innerHTML = "El texto ha cambiado con JavaScript.";
        }

        // Función para cambiar el color del texto
        function cambiarColor() {
            document.getElementById("texto").style.color = "blue";
        }

        // Función para mostrar una alerta en pantalla
        function mostrarAlerta() {
            alert("¡Has hecho clic en el botón de alerta!");
        }

        // Función para mostrar la hora actual
        function mostrarHora() {
            let fecha = new Date();
            let hora = fecha.getHours() + ":" + fecha.getMinutes() + ":" + fecha.getSeconds();
            document.getElementById("hora").innerHTML = hora;
        }
    </script>

</body>
</html>
