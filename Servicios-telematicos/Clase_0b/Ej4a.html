<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con JavaScript</title>
</head>
<body>

    <h1>Formulario con JavaScript</h1>

    <!-- Formulario con un campo de entrada de texto -->
    <form id="miFormulario">
        <label for="nombre">Ingresa tu nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <button type="button" onclick="mostrarNombre()">Enviar</button>
    </form>

    <!-- Párrafo donde se mostrará el resultado -->
    <p id="resultado"></p>

    <script>
        function mostrarNombre() {
            // Obtener el valor del input
            let nombreIngresado = document.getElementById("nombre").value;
            
            // Verificar si se ingresó un nombre
            if (nombreIngresado.trim() === "") {
                document.getElementById("resultado").innerHTML = "Por favor, ingresa un nombre.";
            } else {
                // Mostrar el nombre ingresado en el párrafo con id "resultado"
                document.getElementById("resultado").innerHTML = "Hola, " + nombreIngresado + "!";
            }
        }
    </script>

</body>
</html>
