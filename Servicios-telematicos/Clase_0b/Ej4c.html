<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizadores en JavaScript</title>
</head>
<body>

    <h1>Ejemplo de Temporizadores en JavaScript</h1>

    <!-- Sección para setTimeout -->
    <h2>Ejemplo con setTimeout</h2>
    <button onclick="iniciarTemporizador()">Iniciar Temporizador</button>
    <p id="mensajeTimeout"></p>

    <!-- Sección para setInterval -->
    <h2>Ejemplo con setInterval</h2>
    <button onclick="iniciarContador()">Iniciar Contador</button>
    <button onclick="detenerContador()">Detener Contador</button>
    <button onclick="resetearContador()">Resetear Contador</button>
    <p id="contador">Tiempo: 0 segundos</p>

    <script>
        // ==============================
        // Uso de setTimeout (Ejecuta una vez después de 3 segundos)
        // ==============================
        function iniciarTemporizador() {
            document.getElementById("mensajeTimeout").innerHTML = "Esperando...";
            
            setTimeout(function() {
                document.getElementById("mensajeTimeout").innerHTML = "¡El temporizador terminó después de 3 segundos!";
            }, 3000);
        }

        // ==============================
        // Uso de setInterval (Ejecuta cada segundo)
        // ==============================
        let tiempo = 0;
        let intervalo;

        function iniciarContador() {
            // Si ya está en ejecución, no iniciar otro intervalo
            if (!intervalo) {
                intervalo = setInterval(function() {
                    tiempo++;
                    document.getElementById("contador").innerHTML = "Tiempo: " + tiempo + " segundos";
                }, 1000);
            }
        }

        function detenerContador() {
            clearInterval(intervalo);
            intervalo = null; // Reiniciar la variable para poder reiniciar después
        }

        function resetearContador() {
            detenerContador();
            tiempo = 0;
            document.getElementById("contador").innerHTML = "Tiempo: 0 segundos";
        }
    </script>

</body>
</html>
