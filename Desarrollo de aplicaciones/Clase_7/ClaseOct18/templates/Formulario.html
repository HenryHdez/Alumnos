<!--Los formularios son colecciones de objetos que les permiten 
recolectar y/o mostrar informacion del o al usuario-->
<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
        <title>Formulario</title>
    </head>
    <body>
        <ul class="nav">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Active</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/otrapag">Link</a>
            </li>
            <li class="nav-item">
                <a class="nav-link disabled">Disabled</a>
            </li>
        </ul>
        <div class="alert alert-primary" role="alert">
            Cambiar el contenido de la etiqueta dad por bootstrap
        </div>
        <!--GET Y POST
            GET hacer la petición,
            POST enviar informacion al servidor-->
        <form action="http://localhost:2500/otrapag" method="POST"> 
            <p>
                <label for="Nombre">Nombre:</label>
                <input type="text" id="Nombre" name="Caja1" value="">
                <!--Otras entradas-->
                <div>
                    <input type="radio" id="opcion1" name="opc1">Opcion 1</input>
                    <br>
                    <input type="radio" id="opcion2" name="opc2">Opcion 2</input>
                    <br>
                    <input type="radio" id="opcion3" name="opc3">Opcion 3</input>
                    <br>
                </div>
            </p>
            <!--sumit ejecutar la accion-->
            <!--reset reiniciar el formulario-->
            <p> 
                <input type="submit" value="Ir a otra pagina"> 
                <input type="reset" value="reiniciar formulario"> 
            </p>
        </form>

        <div id="spinwin" class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>

        <br>
        <button id="Boton1" name="Botonext1" onclick="funcion1()" class="btn btn-success">Haga clic aqui</button>
        <br>
        <button id="Boton2" name="Botonext2" onclick="funcion2({{varflask}})" class="btn btn-danger">Haga clic aqui</button>
        <br>
        <p id="prueba" style="color:red; text-size-adjust:10;">Hola</p>


        <br>
        <button id="Boton3" name="Botonext3" onclick="mostrar()" class="btn btn-light">Haga clic aqui</button>
        <br>
        <button id="Boton4" name="Botonext4" onclick="ocultar()" class="btn btn-dark">Haga clic aqui</button>
        <br>
    </body>

    <script text="text/javascript" src="{{ url_for('static', filename='/js/script.js') }}">    </script>

</html>
