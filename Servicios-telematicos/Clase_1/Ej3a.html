<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listas en HTML</title>
</head>
<body>
    <h2>Lista Ordenada</h2>
    <ol>
        <li>Primer elemento</li>
        <li>Segundo elemento</li>
        <li>Tercer elemento</li>
    </ol>

    <h2>Lista No Ordenada</h2>
    <ul>
        <li>Manzana</li>
        <li>Banana</li>
        <li>Naranja</li>
    </ul>
</body>
</html>
