<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla en HTML</title>
</head>
<body>
    <h2>Ejemplo de Tabla</h2>
    <table border="1">
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>País</th>
        </tr>
        <tr>
            <td>Juan</td>
            <td>25</td>
            <td>Colombia</td>
        </tr>
        <tr>
            <td>María</td>
            <td>30</td>
            <td>España</td>
        </tr>
    </table>
</body>
</html>
