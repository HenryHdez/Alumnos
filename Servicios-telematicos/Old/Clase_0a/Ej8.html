<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clases y IDs</title>
    <style>
        .destacado {
            color: purple;
            font-size: 22px;
            font-weight: bold;
        }

        #especial {
            background-color: yellow;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1 class="destacado">Texto Destacado</h1>
    <p class="destacado">Este párrafo tiene una clase.</p>
    <p id="especial">Este párrafo tiene un ID y un fondo amarillo.</p>
</body>
</html>
