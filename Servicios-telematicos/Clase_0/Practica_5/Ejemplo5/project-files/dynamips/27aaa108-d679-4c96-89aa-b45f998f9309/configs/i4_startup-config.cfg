!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R4
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
no ip domain lookup
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
archive
 log config
  hidekeys
! 
!
!
!
ip tcp synwait-time 5
!
!
!
!
interface FastEthernet0/0
 ip address 10.0.45.1 255.255.255.252
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 10.0.34.2 255.255.255.252
 duplex auto
 speed auto
!
router ospf 10
 router-id 4.4.4.4
 log-adjacency-changes
 redistribute bgp 65200 metric 20 subnets route-map BGP-TO-OSPF
 network 10.0.45.0 0.0.0.3 area 0
!
router bgp 65200
 no synchronization
 bgp log-neighbor-changes
 redistribute ospf 10 route-map OSPF-TO-BGP
 neighbor 10.0.34.1 remote-as 65000
 no auto-summary
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
!
ip prefix-list PL-BGP-TO-OSPF seq 5 permit 192.168.10.0/24
!
ip prefix-list PL-OSPF-TO-BGP seq 5 permit 10.10.10.0/24
no cdp log mismatch duplex
!
!
!
route-map OSPF-TO-BGP permit 10
 match ip address prefix-list PL-OSPF-TO-BGP
!
route-map BGP-TO-OSPF permit 10
 match ip address prefix-list PL-BGP-TO-OSPF
 set metric 20
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
line vty 0 4
 login
!
!
end
