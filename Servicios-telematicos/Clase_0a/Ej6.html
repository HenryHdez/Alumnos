<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de CSS en HTML</title>
    <style>
        /* Estilos CSS */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #41576e;
        }
        p {
            color: #e21a1a;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Hola, mundo!</h1>
    <p>Este es un ejemplo básico de cómo usar CSS en HTML.</p>

</body>
</html>
